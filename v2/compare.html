<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edition II — Compare</title><link rel="stylesheet" href="shared/atelier.css"><style>header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);font-size:11px}header a{text-decoration:none}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 68px)}iframe{border:0;width:100%;height:100%}.pane:first-child{border-right:1px solid var(--line)}.pane{min-width:0}select{border:0;background:transparent;color:inherit;font:inherit;padding:5px}label{display:flex;align-items:center;gap:10px}@media(max-width:650px){main{grid-template-columns:1fr;height:auto}.pane{height:85dvh}.pane:first-child{border-right:0;border-bottom:1px solid var(--line)}header{padding:0 16px;gap:8px;font-size:10px}}.pane{position:relative;overflow:hidden}.pane iframe{width:1440px;height:900px;max-width:none;transform-origin:top left}</style></head><body><header><a href="index.html">← All versions</a><label>LEFT <select id="left"></select></label><label>RIGHT <select id="right"></select></label><span>SCROLL EACH FRAME</span></header><main><div class="pane"><iframe id="left-frame" title="Left visual direction"></iframe></div><div class="pane"><iframe id="right-frame" title="Right visual direction"></iframe></div></main><script>const routes={a:'a-editorial',b:'b-cinema',c:'c-media-desk',d:'d-archive',e:'e-chromatic',f:'f-contact-sheet',g:'g-depth',h:'h-panorama'},query=new URLSearchParams(location.search);for(const side of ['left','right']){const sel=document.getElementById(side);for(const [code,route] of Object.entries(routes)){const o=document.createElement('option');o.value=code;o.textContent=code.toUpperCase()+' / '+route.split('-').slice(1).join(' ');sel.append(o);}sel.value=routes[query.get(side==='left'?'a':'b')]?query.get(side==='left'?'a':'b'):side==='left'?'d':'a';function load(){document.getElementById(side+'-frame').src=routes[sel.value]+'/';}sel.addEventListener('change',load);load();}function fitFrames(){for(const pane of document.querySelectorAll(".pane")){const frame=pane.querySelector("iframe"),mobile=innerWidth<650,w=mobile?390:1440,h=mobile?844:900,scale=Math.min(pane.clientWidth/w,pane.clientHeight/h);frame.style.width=w+"px";frame.style.height=h+"px";frame.style.transform="scale("+scale+")";}}new ResizeObserver(fitFrames).observe(document.querySelector("main"));addEventListener("resize",fitFrames,{passive:true});fitFrames();</script></body></html>
